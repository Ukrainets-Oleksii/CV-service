spring.application.name=CV

spring.datasource.url=jdbc:h2:mem:trellomydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

# Налаштування для підтримки великих запитів (для завантаження фото)
server.max-http-header-size=65536
server.max-http-post-size=20971520